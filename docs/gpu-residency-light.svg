<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 295" width="800" height="295" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Time spent at each GPU frequency during one unpinned run: 1204 ms at the 150 MHz floor, 319 ms at 302 MHz, 162 ms at 337 MHz and 116 ms at 376 MHz. Nothing above 376 MHz.">
<rect width="800" height="295" fill="#fcfcfb"/>
<text x="62" y="32" fill="#0b0b0b" font-size="17" font-weight="600">Where the stock GPU governor actually spends a run</text>
<text x="62" y="54" fill="#52514e" font-size="12.5">Time at each DVFS step across one unpinned MobileNet run · 890 MHz is available and never used</text>
<rect x="208" y="84" width="459.3" height="26" rx="4" fill="#2a78d6"/>
<text x="196" y="101" fill="#52514e" font-size="12.5" text-anchor="end">150 MHz (the floor)</text>
<text x="677.3" y="101" fill="#0b0b0b" font-size="12.5" font-weight="600" style="font-variant-numeric:tabular-nums">1204 ms</text>
<rect x="208" y="126" width="121.7" height="26" rx="4" fill="#2a78d6"/>
<text x="196" y="143" fill="#52514e" font-size="12.5" text-anchor="end">302 MHz</text>
<text x="339.7" y="143" fill="#0b0b0b" font-size="12.5" font-weight="600" style="font-variant-numeric:tabular-nums">319 ms</text>
<rect x="208" y="168" width="61.8" height="26" rx="4" fill="#2a78d6"/>
<text x="196" y="185" fill="#52514e" font-size="12.5" text-anchor="end">337 MHz</text>
<text x="279.8" y="185" fill="#0b0b0b" font-size="12.5" font-weight="600" style="font-variant-numeric:tabular-nums">162 ms</text>
<rect x="208" y="210" width="44.2" height="26" rx="4" fill="#2a78d6"/>
<text x="196" y="227" fill="#52514e" font-size="12.5" text-anchor="end">376 MHz</text>
<text x="262.2" y="227" fill="#0b0b0b" font-size="12.5" font-weight="600" style="font-variant-numeric:tabular-nums">116 ms</text>
<text x="62" y="281" fill="#898781" font-size="11.5">1801 ms total, an effective 208 MHz against an 890 MHz peak - 23%.</text>
</svg>
